name: Net-Net Stock Screener Pipeline

on:
  schedule:
    # 平日 18:00 JST（= 09:00 UTC）に差分更新
    - cron: '0 9 * * 1-5'
    # 土曜 00:00 JST（= 金 15:00 UTC）にフルスキャン
    - cron: '0 15 * * 5'
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'EDINETの過去365日分を走査する（processed_docs.csv にある書類はスキップ）'
        type: boolean
        default: false
      rebuild:
        description: '財務キャッシュを作り直す（financial_cache.csv と processed_docs.csv を削除してから全件取得。数時間かかる）'
        type: boolean
        default: false
      repair:
        description: '値が欠けている銘柄だけ再取得する（REPAIR_COLS が対象）'
        type: boolean
        default: false

# 同時実行を1本に制限する。
# スケジュールと手動実行が重なると、同じファイルを2つのジョブが
# 書き換えてコミットが競合する。
concurrency:
  group: screener-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    # rebuild は数時間かかる。既定の6時間では足りない場合があるが、
    # 途中で切れても processed_docs.csv に済んだ分が残るので、
    # もう一度流せば続きから進む。
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # リモートに追従する。
      # 前回のコミットが残っていると push で弾かれるため、
      # 生成物を退避してから reset し、書き戻す。
      - name: リモート追従
        run: |
          set -e
          mkdir -p /tmp/keep
          for f in financial_cache.csv processed_docs.csv \
                   screening_history.csv screening_history_legacy.csv \
                   stock_cache.csv yearly_high_low.csv \
                   jpx_alerts_cache.csv jpx_risk_cache.csv \
                   tse_listed.csv local_price_history.csv; do
            [ -f "$f" ] && cp "$f" /tmp/keep/ || true
          done
          git fetch origin main
          git reset --hard origin/main
          for f in /tmp/keep/*; do
            [ -e "$f" ] && cp "$f" . || true
          done
          echo "--- 追従後の生成物 ---"
          wc -l financial_cache.csv processed_docs.csv screening_history.csv 2>/dev/null || true

      - name: 財務キャッシュの削除（rebuild のみ）
        if: inputs.rebuild
        run: |
          rm -f financial_cache.csv processed_docs.csv
          echo "financial_cache.csv と processed_docs.csv を削除しました。全件取得します。"

      - name: 財務データ更新
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.full_scan }}" = "true" ] || [ "${{ inputs.rebuild }}" = "true" ]; then
            ARGS="$ARGS --full"
          fi
          if [ "${{ inputs.repair }}" = "true" ]; then
            ARGS="$ARGS --repair"
          fi
          # 土曜の定期実行はフルスキャン
          if [ "${{ github.event.schedule }}" = "0 15 * * 5" ]; then
            ARGS="$ARGS --full"
          fi
          echo "python update_financials.py $ARGS"
          python update_financials.py $ARGS

      - name: JPX指定銘柄の取得
        continue-on-error: true
        run: python jpx_alerts.py

      - name: JPX上場リスク情報の取得
        continue-on-error: true
        run: python jpx_risk.py

      # 東証の上場銘柄一覧。月次で足りるので月初にだけ取る。
      # 無い場合も取得する（初回とキャッシュ紛失時のため）。
      - name: 東証上場銘柄一覧の取得
        continue-on-error: true
        run: |
          DAY=$(date -u +%d)
          if [ ! -f tse_listed.csv ] || [ "$DAY" -ge 05 -a "$DAY" -le 12 ]; then
            python fetch_jpx_listed.py
          else
            echo "tse_listed.csv は既にあります（月初のみ更新）。"
          fi

      - name: 年別高値・安値の更新
        continue-on-error: true
        run: python yearly_high_low.py

      - name: スクリーニング実行
        run: python run_screener.py

      - name: 履歴の保存
        run: python save_history.py

      - name: 名証の相場データ取得
        continue-on-error: true
        run: python fetch_local_prices.py

      - name: 地方版スクリーニング
        continue-on-error: true
        run: python run_screener_local.py

      - name: HTML生成
        run: |
          python generate_html.py
          python generate_shortlist.py
          python generate_local_html.py

      - name: CONTEXT.md の生成
        run: python make_context.py

      - name: コミット
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chrono: auto-update financial cache, screening history and pages [skip ci]'
          file_pattern: >-
            financial_cache.csv processed_docs.csv
            screening_history.csv invalid_financials.csv
            net_net_candidates.csv stock_cache.csv
            jpx_alerts_cache.csv
            tse_listed.csv yearly_high_low.csv
            local_prices.csv local_price_history.csv
            net_net_candidates_local.csv
            index.html shortlist.html local.html
            CONTEXT.md

      - name: ログの保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-log
          path: |
            screener.log
            update_financials.log
            yearly_high_low.log
            jpx_risk.log
            invalid_financials.csv
          retention-days: 7
