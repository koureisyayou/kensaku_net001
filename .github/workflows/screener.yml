name: Net-Net Stock Screener Pipeline

on:
  schedule:
    # 平日 18:00 JST (09:00 UTC) : 差分更新
    - cron: '0 9 * * 1-5'
    # 土曜 00:00 JST (金曜 15:00 UTC) : 週末フルスキャン
    - cron: '0 15 * * 5'
  workflow_dispatch:
    inputs:
      full_scan:
        type: boolean
        description: 'フルスキャン（過去365日分の書類を検索）を実行しますか？'
        default: false
      rebuild:
        type: boolean
        description: '財務キャッシュを破棄してゼロから作り直しますか？（処理済みリストも消すため数時間かかります）'
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# 手動フルスキャンとスケジュール実行が重なるとコミットが衝突するため直列化する
concurrency:
  group: net-net-screener
  cancel-in-progress: false

jobs:
  build-and-screen:
    runs-on: ubuntu-latest
    # フルスキャン（数千件のXBRLダウンロード）でも打ち切られないように上限を明示
    timeout-minutes: 350
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 のセットアップ (pipキャッシュ有効)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: pip install -r requirements.txt

      # rebuild 時のみ既存キャッシュを破棄する。
      # processed_docs.csv を消さないと、--full を付けても
      # 「既処理」として全書類がスキップされ、旧ロジックのデータが残り続ける。
      - name: 財務キャッシュの破棄 (rebuild時のみ)
        if: ${{ github.event.inputs.rebuild == 'true' }}
        run: |
          echo "Discarding financial_cache.csv and processed_docs.csv ..."
          rm -f financial_cache.csv processed_docs.csv

      - name: 財務キャッシュの更新 (日次 vs フルスキャン判定)
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.full_scan }}" = "true" ] \
            || [ "${{ github.event.inputs.rebuild }}" = "true" ] \
            || [ "${{ github.event.schedule }}" = "0 15 * * 5" ]; then
            echo "Running FULL SCAN mode..."
            python update_financials.py --full
          else
            echo "Running DAILY DIFFERENTIAL mode..."
            python update_financials.py
          fi

      - name: スクリーニング実行
        run: python run_screener.py

      - name: 履歴データの追記保存
        run: python save_history.py

      - name: HTMLページ生成
        run: python generate_html.py

      # 二次スクリーニング。JPXの取得失敗などで落ちても一次候補の公開は続けたいので
      # continue-on-error を付ける（失敗時は前回の shortlist.html が残る）。
      - name: 二次スクリーニングページ生成
        continue-on-error: true
        run: python generate_shortlist.py

      # 作業ツリーが汚れた状態では通常の pull --rebase は失敗するため autostash を付ける
      - name: リモートの最新差分を pull
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true

      - name: キャッシュ(CSV)、履歴データおよびHTMLをコミット・プッシュ
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: auto-update financial cache, screening history and pages [skip ci]"
          file_pattern: 'financial_cache.csv processed_docs.csv stock_cache.csv net_net_candidates.csv screening_history.csv invalid_financials.csv jpx_alerts_cache.csv index.html shortlist.html'

      - name: ログファイルの保存 (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-log
          path: |
            screener.log
            update_financials.log
            invalid_financials.csv
          if-no-files-found: ignore

      - name: GitHub Pages 向けビルド成果物の準備
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    needs: build-and-screen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へ正式デプロイ
        id: deployment
        uses: actions/deploy-pages@v4

  notify-on-failure:
    needs: [build-and-screen, deploy-pages]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: 失敗時にGitHub Issueを自動作成して通知
        uses: dacbd/create-issue-action@v2
        with:
          token: ${{ github.token }}
          title: "🚨 [Screener Failure] スクリーニングパイプラインが失敗しました"
          body: |
            ワークフローの実行でエラーが発生しました。ログを確認してください。
            - **実行イベント**: ${{ github.event_name }}
            - **実行詳細**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          assignees: ${{ github.actor }}
